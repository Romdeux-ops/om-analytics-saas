name: Sync football data

on:
  schedule:
    # Horaires en UTC : toutes les 30 min de 14h à 1h (heure de Paris), créneaux des matchs.
    - cron: "*/30 12-23 * * *"
    # Rattrapage matinal (reports, horaires fixés par la LFP/UEFA).
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: football-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - run: bun install --frozen-lockfile

      - name: Sync Ligue 1 (football-data.org) + Europa / Coupe (ESPN)
        run: bun run football:sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
