name: Sync press articles

on:
  schedule:
    # Toutes les 6 h UTC : environ 8 h, 14 h, 20 h et 2 h à Paris en été.
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: news-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - run: bun install --frozen-lockfile

      - name: Sync presse (RSS)
        run: bun run football:sync:press
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
